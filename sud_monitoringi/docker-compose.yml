# Ishga tushirish: cp .env.example .env  (qiymatlarni to'ldiring)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sud_monitoringi}
      POSTGRES_USER: ${DB_USER:-sud_monitoringi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD berilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
    volumes:
      - appdata:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Integratsiya, eslatmalar, davriy hisobotlar va kunlik zaxira nusxa
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
    volumes:
      - appdata:/app/data
    command: ["python", "manage.py", "run_scheduler"]
    depends_on:
      - web

volumes:
  pgdata:
  appdata:
