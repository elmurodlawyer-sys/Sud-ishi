{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1 class="page-title">{{ title }}</h1>{% if back %}<a class="btn btn-sm btn-light" href="{% url back %}"><i class="bi bi-arrow-left"></i> Orqaga</a>{% endif %}</div>
<div class="card"><div class="card-body">
  {% include "includes/form_errors.html" %}
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="row">{% for field in form %}{% include "includes/field.html" with col="col-md-6" %}{% endfor %}</div>
    <button class="btn btn-primary mt-2"><i class="bi bi-check2"></i> Saqlash</button>
  </form>
</div></div>
{% endblock %}
